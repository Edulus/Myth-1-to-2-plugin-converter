[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myth-plugin-converter"
version = "0.0.0"
description = "Converts Myth: The Fallen Lords plugins into Myth II: Soulblighter plugins"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
