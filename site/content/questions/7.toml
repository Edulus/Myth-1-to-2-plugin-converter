term = "Q7: Web converter feature and bug reports"
title = "Feature and bug reports for the web converter"
gist = "This is the place to report problems with the converter that runs in your browser. Keep asked for a version number, a list of changes and a \"please test next\" list on the converter page, and it has all three. His reports led to buildings appearing (0.6), a crash at the edge of Crow's Bridge being fixed (0.7), the ground meeting the walls of the bridge (0.8) and, with a screenshot, the bridge's deck being drawn (0.9). For multiplayer he found the real cause of games ending at once: units and scenery now appear (0.11) and flags and balls follow (0.12), which he confirmed. He traced the black or streaky ground after explosions to the map's level-of-detail data (fixed in 0.14, confirmed). Units stand still when they stop (0.16), Forest Giants, Old Growth Forest Giants and Trow attack (0.17), and Journeymen and Heron Guards heal and Yearlings heal themselves (0.18); he confirmed all three. Dwarf Heroes throw uphill and land where you click (0.19, confirmed; Keep's first report of overshooting came from a map converted with 0.18, which is why a converted plugin's name now ends with its converter version, from 0.20). Keep's newest reports (22 November): trees, rocks and mandrake roots can be blown up; the Dwarven Pathfinder's artillery satchels do not explode; a heal used on bare ground wastes a root; in alricvso, Soulblighter's ranged attack and Alric's special do not work as in The Fallen Lords; and water shows no ripples or reflections. Also open: unit size, teal death pieces, the water settings and some death and explosion effects. The current version is 0.20."
body = '''
<p>Please enter any feature or bug reports here about the <a href="../convert/index.html">webtool for converting TFL to M2 plugins</a>.</p>
<p>This question is only for the web converter. It helps to include the converter's version number (shown at the top of its page), the plugin you converted, your browser, and what happened. For a problem in a converted plugin, also paste the start of the <strong>Technical details</strong> shown after converting.</p>'''
