term = "Q7: Web converter feature and bug reports"
title = "Feature and bug reports for the web converter"
gist = "This is the place to report problems with the converter that runs in your browser. Keep asked for a version number, a list of changes and a \"please test next\" list on the converter page, and it now has all three. His reports led to buildings appearing in version 0.6, to a crash at the edge of Crow's Bridge being fixed in 0.7, and to the ground meeting the walls of Crow's Bridge's bridge in 0.8. The crash fix works for every map, not just Crow's Bridge. With a screenshot, Keep then showed that the game didn't draw the bridge's deck, so units seemed to walk on air; that is fixed in 0.9. He can no longer see the floating houses on Tandem. His latest report: multiplayer levels end at once because no teams are present, which is our next job. He checked water and riverbanks in 0.9 and sees no problems. He then reported that explosions leave a black or streaky patch on the ground, and traced it to the explosions' ground ripple. Version 0.10 made converted maps declare themselves Myth II maps, which Project Magma's ZeroPipeline pointed to; it did not fix the explosions. For multiplayer Keep found the real cause: units and scenery now appear (0.11) and the flags and balls follow in 0.12. He also found that saving a map in Loathing makes the explosion glitch go away, so the converter writes some map data differently from Loathing; we have asked him for the maps before and after. Units still moonwalk."
body = '''
<p>Please enter any feature or bug reports here about the <a href="../convert/index.html">webtool for converting TFL to M2 plugins</a>.</p>
<p>This question is only for the web converter. It helps to include the converter's version number (shown at the top of its page), the plugin you converted, your browser, and what happened. For a problem in a converted plugin, also paste the start of the <strong>Technical details</strong> shown after converting.</p>'''
