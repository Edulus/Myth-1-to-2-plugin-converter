n = 3
term = "Q3: A coop map with known scoring to test against"
title = "Is there a coop map with known scoring we could test against?"
gist = "Keep suggested a yardstick: Crow's Bridge, the first Fallen Lords level, which Project Magma had already rebuilt by hand for Myth II in The Fallen Levels v2. By comparing our converted Crow's Bridge with theirs, piece by piece, we found and fixed water that units walked across, stepped hills, floating plants and missing buildings. Later comparisons fixed the ground at Crow's Bridge's bridge and its invisible deck. Keep also asked us to learn from Magma's versions of the units, which comes after the multiplayer fix."
body = "<p>Coop scoring and map actions need play-testing. We've converted the map-action format, but we don't yet know whether TFL and Myth II scripts <em>mean</em> the same thing in play. A map whose correct behaviour you know would tell us.</p>"
