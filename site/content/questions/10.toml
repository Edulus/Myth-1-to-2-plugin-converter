term = "Q10: High-res units and detail textures"
title = "High-resolution units and detail textures: what do you know?"
gist = "As of 19 November 2026 nobody has answered this one. Keep would like converted levels such as Sir Mauriac's Tale to use high-resolution units and detail textures, to bring the old coop into the new century. We have not looked into either yet. From Project Magma's download list: detail textures are a Myth II feature (added in 1.7.0), and Jon God's Detail Texture Megapack adds them to over 450 maps; high-resolution units come with the Twice Born Edition, a full HD remaster of The Fallen Lords and Myth II, and with IronDuke's Iron TagSet. If you know how a map or plugin picks these up, please tell us here."
# True as of 2026-11-19: nobody has replied yet (shows a quiet tag on the home page).
unanswered = true
body = '''
<p>Keep asked whether converted <em>Fallen Lords</em> levels could use high-resolution units and Myth II's detail textures (<code>dtex</code>). We have not researched either yet, so we are asking first.</p>
<p>What we know so far, from Project Magma's download list and the Mythipedia wiki:</p>
<ul>
<li><strong>Detail textures</strong> are a Myth II feature, introduced in version 1.7.0. Jon God's <em>Detail Texture Megapack</em> adds high-resolution ground textures to over 450 maps, including all of Bungie's. It is a plugin you drop into the plugins folder.</li>
<li><strong>High-resolution units</strong> come from the <em>Twice Born Edition</em>, a full remaster of <em>The Fallen Lords</em>, <em>Myth II</em> and <em>Chimera</em> with every sprite and texture updated in HD, and from IronDuke's <em>Iron TagSet</em>, which gives Myth II's units high-resolution models. The wiki says the tagset only partly worked in its first version, and that support for <em>The Fallen Levels</em> was planned for later.</li>
</ul>
<p>What we do not know is how a map or plugin turns these on: whether a converted map's own textures can be matched to a detail texture, and whether converted units could point at the high-resolution versions. Have you used any of these with a Fallen Lords port? Anything you can tell us, including where the files are, helps.</p>'''
