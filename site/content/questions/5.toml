n = 5
term = "Q5: Would you play-test?"
title = "Help test converted levels"
gist = "Keep has been playing converted levels, mostly Sir Mauriac's Tale and crazyglue, a small plugin built on Crow's Bridge with an army of dwarves. His first review listed what was wrong: units walked on water, hills looked blocky, buildings were missing, and units misbehaved. Since then he has confirmed in the game that water, hills, buildings and Crow's Bridge's bridge are fixed, that hosted multiplayer games show units, scenery, flags and balls, that explosions no longer leave black ground, that units stand still when they stop, that Forest Giants, Old Growth Forest Giants and Trow attack, and that healers heal. Still open as of 19 November 2026: unit size needs fine tuning (Keep is measuring it), Dwarf Heroes could not throw uphill (a fix is in 0.19, not yet tested), and some death pieces turn teal. New test reports go in Q7."
body = "<p>A converted level played by someone who knows TFL well would find the subtle problems &mdash; wrong unit sizes, sounds, balance &mdash; that logs can't.</p>"
